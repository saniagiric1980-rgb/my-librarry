<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжная полка{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: -1;
      animation: orb-float 18s ease-in-out infinite alternate;
    }
    .bg-orb-1 {
      width: 500px; height: 500px;
      top: -150px; right: -100px;
      background: radial-gradient(circle, rgba(42, 107, 82, 0.12) 0%, transparent 70%);
      animation-duration: 22s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      bottom: -100px; left: -80px;
      background: radial-gradient(circle, rgba(110, 80, 170, 0.1) 0%, transparent 70%);
      animation-duration: 26s; animation-delay: -8s;
    }
    .bg-orb-3 {
      width: 300px; height: 300px;
      top: 40%; left: 50%; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(200, 160, 100, 0.07) 0%, transparent 70%);
      animation-duration: 20s; animation-delay: -14s;
      animation-name: orb-float-center;
    }
    @keyframes orb-float {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(30px, -20px) scale(1.05); }
      50%  { transform: translate(-20px, 25px) scale(0.97); }
      75%  { transform: translate(15px, 10px) scale(1.02); }
      100% { transform: translate(-10px, -15px) scale(1); }
    }
    @keyframes orb-float-center {
      0%   { transform: translate(-50%, -50%) scale(1); }
      25%  { transform: translate(-45%, -55%) scale(1.08); }
      50%  { transform: translate(-55%, -45%) scale(0.95); }
      75%  { transform: translate(-48%, -52%) scale(1.04); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ url_for('index') }}">Книжная полка</a>

      <nav>
        <a href="{{ url_for('index') }}">Каталог</a>

        {% if session.get('is_admin') %}
          <a href="{{ url_for('admin') }}">Управление</a>
          <form class="inline-form" method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="nav-button" type="submit">Выйти</button>
          </form>
        {% else %}
          <a href="{{ url_for('login') }}">Вход владельца</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
