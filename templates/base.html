<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Моя библиотека{% endblock %}</title>
    <meta name="description" content="Личная онлайн-библиотека: книги в форматах PDF и EPUB.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="{{ url_for('index') }}">
                <span class="logo-icon">📚</span>
                Моя библиотека
            </a>

            <nav>
                <a href="{{ url_for('index') }}">Книги</a>

                {% if session.get("is_admin") %}
                    <a href="{{ url_for('admin') }}">Панель управления</a>
                    <form class="inline-form" method="post" action="{{ url_for('logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="nav-button">Выйти</button>
                    </form>
                {% else %}
                    <a href="{{ url_for('login') }}">Вход</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="flash {% if category == 'error' %}error{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
